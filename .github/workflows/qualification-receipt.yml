name: Team Registry canonical qualification receipt
run-name: Team Registry qualification receipt for 1.0.0-pilot.1

on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Audited qualification receipt workflow commit on master
        type: string
        required: true

permissions: {}
defaults:
  run:
    shell: bash

env:
  QUALIFIED_MASTER: 61130d6ceb4ae5bb0a81db6a78705eb56ebc98e7
  QUALIFIED_RUN: "44926532580"
  QUALIFIED_SOURCE: 97980401b73877f4c2dbf4b56a365cbc07756206
  CANDIDATE_REF: refs/heads/impl-change-v0052-deploy-with-helmfile
  PACKAGE: pandops/flowai-team-registry
  SNAPSHOT: 1.0.0-pilot.1
  MANIFEST: sha256:558598de671131b11ef4e97a15645b5c908e1acf8cb205c577d93fa3f678a2b9
  SKOPEO: quay.io/skopeo/stable@sha256:8342e1e8d7b12d0bd3bf53ce8f4fde7ed876277aa8e4345f53937a505309e6b5

jobs:
  receipt:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'pandops/flowai-team-registry' &&
      github.repository_id == '1466400175' &&
      github.repository_owner_id == '66165742' &&
      github.actor_id == '66165742' &&
      github.triggering_actor == 'pandops' &&
      github.run_attempt == '1' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
    steps:
      - name: Verify the protected workflow and candidate refs
        env:
          EXPECTED_WORKFLOW: ${{ inputs.expected_workflow_sha }}
        run: |
          [[ "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/qualification-receipt.yml@refs/heads/master" ]]
          [[ "$EXPECTED_WORKFLOW" =~ ^[0-9a-f]{40}$ && "$EXPECTED_WORKFLOW" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
          upstream="https://github.com/$GITHUB_REPOSITORY.git"
          [[ "$(git ls-remote --exit-code "$upstream" refs/heads/master)" == "$GITHUB_SHA"$'\trefs/heads/master' ]]
          [[ "$(git ls-remote --exit-code "$upstream" "$CANDIDATE_REF")" == "$QUALIFIED_SOURCE"$'\t'"$CANDIDATE_REF" ]]

      - name: Verify the original qualification run and immutable context
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="repos/$GITHUB_REPOSITORY/actions"
          gh api "$api/runs/$QUALIFIED_RUN/attempts/1" | jq -e \
            --arg sha "$QUALIFIED_MASTER" --arg run "$QUALIFIED_RUN" '
            (.id | tostring) == $run and .run_attempt == 1 and .head_sha == $sha
            and .repository.id == 1466400175 and .head_repository.id == 1466400175
            and .head_branch == "master" and .path == ".github/workflows/publication.yml"
            and .workflow_id == 426131708 and .event == "workflow_dispatch"
            and .actor.id == 66165742 and .triggering_actor.id == 66165742
            and .status == "completed" and .conclusion == "success"' > /dev/null
          gh api "$api/runs/$QUALIFIED_RUN/attempts/1/jobs" | jq -e --arg run "$QUALIFIED_RUN" '
            def passed($job; $step):
              any(.jobs[]; .name == $job and any(.steps[]; .name == $step and .conclusion == "success"));
            .total_count == 4
            and ([.jobs[].name] | sort) == ["build","qualify","select","verify-publication-context"]
            and all(.jobs[]; (.run_id | tostring) == $run and .run_attempt == 1
              and .status == "completed" and .conclusion == "success")
            and passed("qualify"; "Run required unit and PostgreSQL integration tests")
            and passed("build"; "Export the qualified production context as OCI")
            and passed("build"; "Verify OCI layout and digests")
            and passed("verify-publication-context"; "Resolve the candidate prerelease with semantic-release")
            and passed("verify-publication-context"; "Bind the attempt, pinned inputs and verified artifact bytes")' > /dev/null

          context_zip=35ed6b07c42d88a4cbcc9681eb2e6b8d5a0e49ab30687d5d7bb74c68d43e196a
          gh api "$api/artifacts/14716061731" | jq -e --arg digest "sha256:$context_zip" \
            --arg sha "$QUALIFIED_MASTER" --arg run "$QUALIFIED_RUN" '
            .id == 14716061731 and .name == "publication-context-1" and .expired == false and .digest == $digest
            and (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha
            and .workflow_run.head_branch == "master"
            and .workflow_run.repository_id == 1466400175 and .workflow_run.head_repository_id == 1466400175' > /dev/null
          work="$(mktemp -d "$RUNNER_TEMP/qualified.XXXXXX")"
          cd "$work" || exit 1
          gh api "$api/artifacts/14716061731/zip" > context.zip
          printf '%s  context.zip\n' "$context_zip" | sha256sum --check
          [[ "$(unzip -Z1 context.zip)" == publication-context.json ]]
          unzip -p context.zip publication-context.json > context.json
          # The pinned context already binds both evidence ZIPs, the consumer inputs, and the
          # production tree (including owned schemas) shared by qualification and the build.
          jq -e --arg repository "$PACKAGE" --arg workflow "$QUALIFIED_MASTER" \
            --arg source "$QUALIFIED_SOURCE" --arg ref "$CANDIDATE_REF" \
            --arg version "$SNAPSHOT" --arg manifest "$MANIFEST" --arg run "$QUALIFIED_RUN" '
            .repository == $repository and .workflow == $workflow and .source == $source and .ref == $ref
            and .workflowDigest == "sha256:66adba70b780f1379fa6d73fa1ff9df58476e81dd62d27336bb471c3235c80d7"
            and .run == $run and .attempt == "1" and .pins == []
            and .productionIdentity == "sha256:fe88a37029bb9b7d561fab0a23061f95daa2c51da6459ac91baad7857ff242e3"
            and .version == {version:$version, tag:("v"+$version), target:$source, channel:"pilot"}
            and .qualification.id == "14715569002"
            and .qualification.zipDigest == "sha256:e6a62bdac5b12c92d26ba5eeabe4df9ed76c85354e97f6245ee25abb12bf8f20"
            and .oci.id == "14715761748"
            and .oci.zipDigest == "sha256:912ab7f8fb9a2bb94cd986705027eaf954905fd7a47f8e61a71c71ac57cc1f3d"
            and .oci.files == "7d4e4711e43dac12dd19ac0221b851a0e544b2c29b0e71322c0cbbab8267aa6a  image.oci.tar\n"
            and .oci.manifest == $manifest and .oci.platform == "linux/amd64"' context.json > /dev/null
          mv context.json "$RUNNER_TEMP/qualification-context.json"

      - name: Verify the separately published GHCR image anonymously
        run: |
          state="$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXX")"
          printf '{}\n' > "$state/anonymous.json"
          image="docker://ghcr.io/$PACKAGE"
          skopeo() {
            docker run --rm --platform linux/amd64 --entrypoint /usr/bin/skopeo \
              --mount "type=bind,source=$state,target=/state" "$SKOPEO" "$@"
          }
          skopeo copy --preserve-digests --src-authfile /state/anonymous.json \
            "$image@$MANIFEST" dir:/state/pull
          printf '%s  %s\n' "${MANIFEST#sha256:}" "$state/pull/manifest.json" | sha256sum --check
          skopeo inspect --raw --authfile /state/anonymous.json "$image:$SNAPSHOT" > "$state/tag.json"
          printf '%s  %s\n' "${MANIFEST#sha256:}" "$state/tag.json" | sha256sum --check
          mv "$state/tag.json" "$RUNNER_TEMP/published-manifest.json"

      - name: Emit canonical v1 qualification receipt
        run: |
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ID" != "$QUALIFIED_RUN" ]]
          manifest_checksum="$(sha256sum "$RUNNER_TEMP/published-manifest.json")"
          image_digest="sha256:${manifest_checksum%% *}"
          [[ "$image_digest" == "$MANIFEST" ]]
          mkdir "$RUNNER_TEMP/qualification-receipt"
          # The resolver checks these workflow coordinates against this successful artifact-producing run.
          # The original qualification run is independently verified above.
          jq -e --arg path ".github/workflows/qualification-receipt.yml" --argjson run "$GITHUB_RUN_ID" \
            --arg image "$image_digest" --arg source "$QUALIFIED_SOURCE" '
            select(.source == $source and .version.target == $source and .oci.manifest == $image and .pins == [])
            | {schema:1, repository, sourceRevision:.source, buildSourceRevision:.source,
               version:.version.version, imageDigest:$image, schemaInputs:.pins, workflowPath:$path,
               runId:$run, outcomes:{unit:"success", integration:"success", build:"success"}}' \
            "$RUNNER_TEMP/qualification-context.json" > "$RUNNER_TEMP/qualification-receipt/qualification.json"

      - name: Upload the sole canonical receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-receipt/qualification.json
          if-no-files-found: error
