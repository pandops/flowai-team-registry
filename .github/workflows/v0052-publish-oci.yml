          upstream="https://github.com/$GITHUB_REPOSITORY.git"
          source="$(jq -er .source "$RUNNER_TEMP/pin.json")"
          [[ "$(git ls-remote --exit-code "$upstream" refs/heads/master)" == "$GITHUB_SHA"$'\trefs/heads/master' ]]
          [[ "$(git ls-remote --exit-code "$upstream" "$CANDIDATE_REF")" == "$source"$'\t'"$CANDIDATE_REF" ]]
          printf 'SOURCE=%s\n' "$source" >> "$GITHUB_ENV"

      - name: Verify the original qualification and the retained OCI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import concurrent.futures
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import shutil
          import subprocess
          import urllib.request
          import zipfile

          root = Path(os.environ["RUNNER_TEMP"])
          pin = json.loads((root / "pin.json").read_bytes())
          endpoint = f'repos/{pin["repository"]}/actions'
          source = pin["source"]
          ref = os.environ["CANDIDATE_REF"]
          branch = ref.removeprefix("refs/heads/")
          sha256 = lambda data: "sha256:" + hashlib.sha256(data).hexdigest()

          def api(route):
              return json.loads(subprocess.check_output(["gh", "api", f"{endpoint}/{route}"]))

          def web(url):
              with urllib.request.urlopen(url, timeout=30) as response:
                  return response.read(2 * 1024 * 1024 + 1)

          def checksum(stream):
              return "sha256:" + hashlib.file_digest(stream, "sha256").hexdigest()

          run_id = pin["run"]
          attempt = api(f"runs/{run_id}/attempts/1")
          assert (attempt["id"], attempt["run_attempt"], attempt["head_sha"], attempt["head_branch"],
                  attempt["workflow_id"], attempt["path"], attempt["event"], attempt["status"], attempt["conclusion"]) == (
                  run_id, 1, source, branch, pin["workflowId"], ".github/workflows/qualify.yml",
                  "workflow_dispatch", "completed", "success")
          assert attempt["actor"]["id"] == attempt["triggering_actor"]["id"] == 66165742
          assert attempt["repository"]["id"] == attempt["head_repository"]["id"] == pin["repoId"]
          workflow = web(f'https://raw.githubusercontent.com/{pin["repository"]}/{source}/{attempt["path"]}')
          assert sha256(workflow) == pin["workflowDigest"]
          jobs = api(f"runs/{run_id}/attempts/1/jobs")
          assert jobs["total_count"] == 1
          job, = jobs["jobs"]
          assert (job["id"], job["name"], job["run_id"], job["run_attempt"], job["head_sha"],
                  job["status"], job["conclusion"]) == (pin["job"], "qualify", run_id, 1, source, "completed", "success")
          steps = {str(step["number"]): step["name"] for step in job["steps"] if step["conclusion"] == "success"}
          assert all(steps.get(number) == name for number, name in pin["steps"].items())

          def download(artifact_id, name, digest):
              artifact = api(f"artifacts/{artifact_id}")
              assert (artifact["id"], artifact["name"], artifact["expired"], artifact["digest"]) == (
                  artifact_id, name, False, digest)
              origin = artifact["workflow_run"]
              assert (origin["id"], origin["head_sha"], origin["head_branch"], origin["repository_id"],
                      origin["head_repository_id"]) == (run_id, source, branch, pin["repoId"], pin["repoId"])
              path = root / f"{artifact_id}.zip"
              with path.open("x+b") as stream:
                  subprocess.run(["gh", "api", f"{endpoint}/artifacts/{artifact_id}/zip"], stdout=stream, check=True)
                  stream.seek(0)
                  assert checksum(stream) == digest
              return path

          archive = download(pin["artifact"], pin["artifactName"], pin["artifactDigest"])
          with zipfile.ZipFile(archive) as oci:
              members = {}
              for line in oci.read("SHA256SUMS").decode().splitlines():
                  match = re.fullmatch(r"([a-f0-9]{64})  ([a-zA-Z0-9._-]+)", line)
                  assert match
                  digest, member = match.groups()
                  assert member not in members
                  members[member] = "sha256:" + digest
              assert sorted(oci.namelist()) == sorted(["SHA256SUMS", *members])
              assert members["image.oci.tar"] == pin["tarDigest"]
              for member, digest in members.items():
                  with oci.open(member) as stream:
                      assert checksum(stream) == digest
              with oci.open("image.oci.tar") as stream, (root / "qualified.oci.tar").open("xb") as output:
                  shutil.copyfileobj(stream, output)
              if pin["provenance"]:
                  assert set(oci.namelist()) == {"SHA256SUMS", "image.oci.tar"}
              else:
                  receipt = json.loads(oci.read("receipt.json"))
                  assert (receipt["repository"], receipt["ref"], receipt["source"], str(receipt["run"]),
                          str(receipt["attempt"]), receipt["manifest"], receipt["config"]) == (
                      pin["repository"], ref, source, str(run_id), "1", pin["manifest"], pin["config"])
          if metadata := pin["provenance"]:
              archive = download(metadata["id"], metadata["name"], metadata["digest"])
              with zipfile.ZipFile(archive) as original:
                  assert original.namelist() == ["oci-provenance.json"]
                  provenance = json.loads(original.read("oci-provenance.json"))
              assert (provenance["repository"], provenance["sourceSha"], provenance["workflowPath"],
                      provenance["runId"], provenance["runAttempt"], provenance["platform"],
                      provenance["configDigest"], provenance["manifestDigest"], provenance["archiveSha256"]) == (
                  pin["repository"], source, attempt["path"], run_id, 1, "linux/amd64", pin["config"],
                  pin["manifest"], pin["tarDigest"].removeprefix("sha256:"))

          publishers = pin["publisherRevisions"]

          def verify_schema(item):
              repository, path = item["repository"], item["path"]
              base = f"https://raw.githubusercontent.com/{repository}"
              original = web(f'{base}/{item["sourceRevision"]}/{path}')
              assert sha256(original) == item["digest"], f"Original schema checksum: {repository}/{path}"
              selected = publishers[repository]
              if selected != item["sourceRevision"] and web(f"{base}/{selected}/{path}") != original:
                  print(f"Selected schema differs: {repository} {selected} {path}", flush=True)
                  return item
              return dict(item, sourceRevision=selected)

          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
              pin["schemaInputs"] = list(pool.map(verify_schema, pin["qualifiedSchemaInputs"]))
          pin["selectedSchemasVerified"] = all(
              item["sourceRevision"] == publishers[item["repository"]] for item in pin["schemaInputs"])
          (root / "pin.json").write_text(json.dumps(pin) + "\n")
          PY

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Resolve the version with pinned semantic-release
        run: |
          lock_root="$RUNNER_TEMP/semantic-release"
          mkdir "$lock_root"
          trusted=https://raw.githubusercontent.com/pandops/flowai-team-registry/c18e7cdde5d5b976f549d1dc486f60776cbb8718/.github/semantic-release
          cd "$lock_root"
          curl --fail --silent --show-error --max-time 30 "$trusted/package.json" -o package.json
          curl --fail --silent --show-error --max-time 30 "$trusted/package-lock.json" -o package-lock.json
          sha256sum --check <<'LOCKS'
          891ec3a55b9fccf0b49fe0ac0a98f9e9fd5bbd7f1743e0f0e51d6286a178d16b  package.json
          aa53698b9420885d999a383abe2f5fafa453bd5aa938dc9ff3ce3e1ef42551a9  package-lock.json
          LOCKS
          npm ci --ignore-scripts --no-audit --no-fund
          mirror="$RUNNER_TEMP/version.git"
          metadata="$RUNNER_TEMP/version-metadata"
          upstream="https://github.com/$GITHUB_REPOSITORY.git"
          git init --quiet --bare "$mirror"
          git -C "$mirror" fetch --quiet --tags "$upstream" \
            refs/heads/master:refs/heads/master "$CANDIDATE_REF:$CANDIDATE_REF" \
            'refs/notes/semantic-release-*:refs/notes/semantic-release-*'
          [[ "$(git -C "$mirror" rev-parse refs/heads/master)" == "$GITHUB_SHA" ]]
          [[ "$(git -C "$mirror" rev-parse "$CANDIDATE_REF")" == "$SOURCE" ]]
          git init --quiet "$metadata"
          git -C "$metadata" config core.hooksPath /dev/null
          git -C "$metadata" remote add origin "$mirror"
          git -C "$metadata" fetch --quiet --tags origin "$CANDIDATE_REF:$CANDIDATE_REF"
          git -C "$metadata" symbolic-ref HEAD "$CANDIDATE_REF"
          [[ "$(git -C "$metadata" rev-parse HEAD)" == "$SOURCE" ]]
          branch="${CANDIDATE_REF#refs/heads/}"
          jq -n --arg branch "$branch" '{
            branches:["master", {name:$branch, prerelease:"pilot", channel:"pilot"}],
            plugins:["@semantic-release/commit-analyzer"], tagFormat:"v${version}"
          }' > "$metadata/.releaserc.json"
          cd "$metadata"
          log="$RUNNER_TEMP/semantic-release.log"
          env -i PATH="$PATH" HOME="$metadata" LANG=C.UTF-8 NO_COLOR=1 \
            GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1 GIT_TERMINAL_PROMPT=0 \
            "$lock_root/node_modules/.bin/semantic-release" \
            --dry-run --no-ci --repository-url "$mirror" 2>&1 | tee "$log"
          snapshot="$(sed -n 's/^.*[Tt]he next release version is //p' "$log")"
          [[ "$snapshot" =~ ^[0-9]+\.[0-9]+\.[0-9]+-pilot\.[1-9][0-9]*$ ]]
          grep -Fq "Skip v$snapshot tag creation in dry-run mode" "$log"
          grep -Fq "Run automated release from branch $branch on repository $mirror in dry-run mode" "$log"
          grep -Fq "Published release $snapshot on pilot channel" "$log"
          printf 'SNAPSHOT=%s\n' "$snapshot" >> "$GITHUB_ENV"

      - name: Publish or reconcile the immutable version
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          umask 077
          pin="$RUNNER_TEMP/pin.json"
          evidence="$RUNNER_TEMP/publication.json"
          state="$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXX")"
          trap 'sudo rm -rf -- "$state"' EXIT
          package="$GITHUB_REPOSITORY"
          manifest="$(jq -er .manifest "$pin")"
          config="$(jq -er .config "$pin")"
          destination="docker://ghcr.io/$package"
          media="application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json"
          skopeo() {
            docker run --rm -i --platform linux/amd64 --entrypoint /usr/bin/skopeo \
              --mount "type=bind,source=$state,target=/state" \
              --mount "type=bind,source=$RUNNER_TEMP/qualified.oci.tar,target=/qualified.oci.tar,readonly" \
              "$SKOPEO" "$@"
          }
          lookup() {
            printf 'header = "Authorization: Bearer %s"\n' "$1" | curl --config - -sS --max-time 30 \
              -H "Accept: $media" -o "$state/manifest" -w '%{http_code}' "https://ghcr.io/v2/$package/manifests/$2"
          }
          check_digest() {
            printf '%s  %s\n' "${manifest#sha256:}" "$1" | sha256sum --check
          }
          absent() {
            jq -e '(.errors | length) == 1 and (.errors[0].code == "MANIFEST_UNKNOWN" or .errors[0].code == "NAME_UNKNOWN")' "$state/manifest" > /dev/null
          }
          record() {
            jq --arg outcome "$1" --arg operation "$operation" --arg image "ghcr.io/$package:$SNAPSHOT" \
              --arg version "$SNAPSHOT" --arg workflow "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" \
              '. + {outcome:$outcome, operation:$operation, image:$image, version:$version,
                publicationWorkflow:$workflow, publicationRun:$run}' "$pin" > "$evidence"
          }
          docker pull --platform linux/amd64 "$SKOPEO"
          skopeo inspect --raw oci-archive:/qualified.oci.tar > "$state/qualified.json"
          check_digest "$state/qualified.json"
          jq -e --arg config "$config" '.schemaVersion == 2 and .config.digest == $config' "$state/qualified.json" > /dev/null
          skopeo inspect --config oci-archive:/qualified.oci.tar | jq -e '.os == "linux" and .architecture == "amd64"' > /dev/null

          upstream="https://github.com/$GITHUB_REPOSITORY.git"
          [[ "$(git ls-remote --exit-code "$upstream" refs/heads/master)" == "$GITHUB_SHA"$'\trefs/heads/master' ]]
          [[ "$(git ls-remote --exit-code "$upstream" "$CANDIDATE_REF")" == "$SOURCE"$'\t'"$CANDIDATE_REF" ]]
          registry_token="$(printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | \
            curl --config - -fsS --max-time 30 --get https://ghcr.io/token \
              --data-urlencode service=ghcr.io --data-urlencode "scope=repository:$package:pull,push" | jq -er '.token')"
          [[ "$registry_token" =~ ^[A-Za-z0-9_.=+/-]+$ ]]
          printf '::add-mask::%s\n' "$registry_token"
          operation=none
          status="$(lookup "$registry_token" "$SNAPSHOT")"
          if [[ "$status" == 404 ]]; then
            absent
            printf '%s\n' "$GHCR_TOKEN" | skopeo login --authfile /state/auth.json --username "$GITHUB_ACTOR" --password-stdin ghcr.io
            status="$(lookup "$registry_token" "$SNAPSHOT")"
          fi
          case "$status" in
            200)
              if ! check_digest "$state/manifest"; then
                record tag_conflict
                exit 1
              fi
              operation=reconciled
              ;;
            404)
              absent
              operation=copy
              record copy_pending_verification
              skopeo copy --preserve-digests --digestfile /state/published-digest \
                --dest-authfile /state/auth.json oci-archive:/qualified.oci.tar "$destination:$SNAPSHOT"
              [[ "$(cat "$state/published-digest")" == "$manifest" ]]
              operation=published
              ;;
            *)
              record registry_lookup_refused
              exit 1
              ;;
          esac
          [[ "$(lookup "$registry_token" "$SNAPSHOT")" == 200 ]]
          cmp "$state/qualified.json" "$state/manifest"
          [[ "$(lookup "$registry_token" "$manifest")" == 200 ]]
          cmp "$state/qualified.json" "$state/manifest"
          record authenticated_bytes_verified

          printf '{}\n' > "$state/anonymous.json"
          mkdir "$state/pull"
          if ! skopeo copy --preserve-digests --src-authfile /state/anonymous.json \
              "$destination@$manifest" dir:/state/pull; then
            record anonymous_pull_unverified
            exit 1
          fi
          cmp "$state/qualified.json" "$state/pull/manifest.json"
          skopeo inspect --raw --authfile /state/anonymous.json "$destination:$SNAPSHOT" > "$state/manifest"
          cmp "$state/qualified.json" "$state/manifest"
          record anonymous_pull_verified

      - name: Upload publication evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: ignore

      - name: Emit strict v1 qualification receipt
        run: |
          jq -e --arg path ".github/workflows/v0052-snapshot.yml" '
            select(.outcome == "anonymous_pull_verified")
            | {schema:1, repository, sourceRevision:.source, buildSourceRevision:.source,
               version, imageDigest:.manifest, schemaInputs, workflowPath:$path,
               runId:.publicationRun, outcomes}' "$RUNNER_TEMP/publication.json" > "$RUNNER_TEMP/qualification.json"

      - name: Upload the canonical qualification receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-receipt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification.json
          if-no-files-found: error
