name: Publish the retained v0052 snapshot
on:
  workflow_call:
    inputs:
      expected_workflow_sha:
        type: string
        required: true
permissions: {}
defaults:
  run:
    shell: bash
env:
  CANDIDATE_REF: refs/heads/impl-change-v0052-deploy-with-helmfile
  SKOPEO: quay.io/skopeo/stable@sha256:8342e1e8d7b12d0bd3bf53ce8f4fde7ed876277aa8e4345f53937a505309e6b5
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository_owner_id == '66165742' &&
      github.actor_id == '66165742' &&
      github.triggering_actor == 'pandops' &&
      github.run_attempt == '1' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      packages: write
    concurrency:
      group: ghcr-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Verify the caller and select the immutable qualification inputs
        env:
          EXPECTED_WORKFLOW: ${{ inputs.expected_workflow_sha }}
          CALLER_REPO_ID: ${{ github.repository_id }}
        run: |
          [[ "$EXPECTED_WORKFLOW" =~ ^[a-f0-9]{40}$ && "$GITHUB_SHA" == "$EXPECTED_WORKFLOW" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/v0052-snapshot.yml@refs/heads/master" ]]
