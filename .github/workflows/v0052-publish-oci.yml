          {"repository":"pandops/flowai-web-ui","source":"771e3f2fcd6cf190165d2d4af9da7a14bf0d6d2e","run":44939781369,"job":136954224090,"artifact":14721514630,"repoId":1466579712,"workflowId":425996091,"workflowDigest":"sha256:32eb299b9b0010fa0197028cfbcc9c9a299e2752936279494e6014955bc9a6dd","artifactName":"oci-1","artifactDigest":"sha256:48cf6e1fe629346118a423757fbdcdeb5b85eb815770807ca2b40acef00b2496","tarDigest":"sha256:725e3cf861a60c08ceb8d46b6d28d74e893d7c32abd095968da1204097523463","manifest":"sha256:90e331728ee20d313ffa14de46e7d9a5d80e02d7c90f0cd2b72612130aa61b9a","config":"sha256:17dd4c5994e14627db38564845f7293c947cc1a6fc72cc8ecc5cfd50ed592251","steps":{"2":"Verify dispatch SHA","3":"Run actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd","4":"Verify candidate checkout","5":"Run actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417","6":"Run actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e","7":"Go unit tests","8":"Install locked browser unit dependencies","9":"Build untagged Linux amd64 artifact","10":"Browser unit tests against the built image","11":"Verify runner-local image after tests","12":"Export the tested image as OCI","13":"Verify OCI layout and digests","14":"Run actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a","15":"Run actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"},"qualifiedSchemaInputs":[],"provenance":{"id":14721469870,"name":"oci-provenance-1","digest":"sha256:fb3f1f28393dbef128c290d91413bf57523e920becc01789fe3252ae7ac19f3d"},"outcomes":{"unit":"success","integration":"not-applicable","build":"success"},"publisherRevisions":{}}
