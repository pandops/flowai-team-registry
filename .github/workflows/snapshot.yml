name: Team Registry snapshot publication
run-name: Publish Team Registry 1.0.0-pilot.1

on:
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Audited snapshot workflow commit on master
        type: string
        required: true

permissions: {}
concurrency:
  group: ghcr-pandops-flowai-team-registry
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  QUALIFIED_MASTER: 61130d6ceb4ae5bb0a81db6a78705eb56ebc98e7
  QUALIFIED_RUN: "44926532580"
  QUALIFIED_SOURCE: 97980401b73877f4c2dbf4b56a365cbc07756206
  CANDIDATE_REF: refs/heads/impl-change-v0052-deploy-with-helmfile
  CONTEXT_ZIP: 35ed6b07c42d88a4cbcc9681eb2e6b8d5a0e49ab30687d5d7bb74c68d43e196a
  OCI_TAR: 7d4e4711e43dac12dd19ac0221b851a0e544b2c29b0e71322c0cbbab8267aa6a
  MANIFEST: sha256:558598de671131b11ef4e97a15645b5c908e1acf8cb205c577d93fa3f678a2b9
  PACKAGE: pandops/flowai-team-registry
  SNAPSHOT: 1.0.0-pilot.1
  SKOPEO: quay.io/skopeo/stable@sha256:8342e1e8d7b12d0bd3bf53ce8f4fde7ed876277aa8e4345f53937a505309e6b5

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'pandops/flowai-team-registry' &&
      github.repository_id == '1466400175' &&
      github.repository_owner_id == '66165742' &&
      github.actor_id == '66165742' &&
      github.triggering_actor == 'pandops' &&
      github.run_attempt == '1' &&
      github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: team-registry-snapshot
    permissions:
      actions: read
      packages: write
    steps:
      - name: Verify the trusted workflow and qualification artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW: ${{ inputs.expected_workflow_sha }}
        run: |
          [[ "$GITHUB_REF_PROTECTED" == true ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/snapshot.yml@refs/heads/master" ]]
          [[ "$EXPECTED_WORKFLOW" =~ ^[0-9a-f]{40}$ && "$EXPECTED_WORKFLOW" == "$GITHUB_WORKFLOW_SHA" ]]
          [[ "$GITHUB_SHA" == "$GITHUB_WORKFLOW_SHA" ]]
          upstream="https://github.com/$GITHUB_REPOSITORY.git"
          [[ "$(git ls-remote --exit-code "$upstream" refs/heads/master)" == "$GITHUB_SHA"$'\trefs/heads/master' ]]
          [[ "$(git ls-remote --exit-code "$upstream" "$CANDIDATE_REF")" == "$QUALIFIED_SOURCE"$'\t'"$CANDIDATE_REF" ]]

          api="repos/$GITHUB_REPOSITORY/actions"
          gh api "$api/runs/$QUALIFIED_RUN/attempts/1" | jq -e \
            --arg sha "$QUALIFIED_MASTER" --arg run "$QUALIFIED_RUN" '
            (.id | tostring) == $run and .run_attempt == 1 and .head_sha == $sha
            and .repository.id == 1466400175 and .head_repository.id == 1466400175
            and .head_branch == "master" and .path == ".github/workflows/publication.yml"
            and .workflow_id == 426131708 and .event == "workflow_dispatch"
            and .actor.id == 66165742 and .triggering_actor.id == 66165742
            and .status == "completed" and .conclusion == "success"' > /dev/null
          gh api "$api/runs/$QUALIFIED_RUN/attempts/1/jobs" | jq -e '
            .total_count == 4 and (.jobs | length) == 4
            and ([.jobs[].name] | sort) == ["build","qualify","select","verify-publication-context"]
            and all(.jobs[]; .run_attempt == 1 and .status == "completed" and .conclusion == "success")' > /dev/null
          cd "$(mktemp -d "$RUNNER_TEMP/qualified.XXXXXX")"
          fetch() {
            local id=$1 name=$2 digest=$3
            gh api "$api/artifacts/$id" | jq -e --arg id "$id" --arg name "$name" \
              --arg digest "sha256:$digest" --arg sha "$QUALIFIED_MASTER" --arg run "$QUALIFIED_RUN" '
              (.id | tostring) == $id and .name == $name and .expired == false and .digest == $digest
              and (.workflow_run.id | tostring) == $run and .workflow_run.head_sha == $sha
              and .workflow_run.head_branch == "master"
              and .workflow_run.repository_id == 1466400175 and .workflow_run.head_repository_id == 1466400175' > /dev/null
            gh api "$api/artifacts/$id/zip" > "$name.zip"
            printf '%s  %s.zip\n' "$digest" "$name" | sha256sum --check
          }
          fetch 14715569002 qualification-1 e6a62bdac5b12c92d26ba5eeabe4df9ed76c85354e97f6245ee25abb12bf8f20
          fetch 14715761748 oci-1 912ab7f8fb9a2bb94cd986705027eaf954905fd7a47f8e61a71c71ac57cc1f3d
          fetch 14716061731 publication-context-1 "$CONTEXT_ZIP"

          [[ "$(unzip -Z1 publication-context-1.zip)" == publication-context.json ]]
          [[ "$(unzip -Z1 oci-1.zip | sort)" == $'SHA256SUMS\nimage.oci.tar' ]]
          [[ "$(unzip -Z1 qualification-1.zip | sort)" == $'SHA256SUMS\nintegration.log\nunit.log' ]]
          unzip -p publication-context-1.zip publication-context.json > context.json
          unzip -q oci-1.zip image.oci.tar
          unzip -p oci-1.zip SHA256SUMS > oci.expected
          sha256sum image.oci.tar > oci.actual
          cmp oci.expected oci.actual
          printf '%s  image.oci.tar\n' "$OCI_TAR" | sha256sum --check
          unzip -q qualification-1.zip unit.log integration.log
          unzip -p qualification-1.zip SHA256SUMS > qualification.expected
          sha256sum unit.log integration.log > qualification.actual
          cmp qualification.expected qualification.actual

          jq -e --arg repository "$GITHUB_REPOSITORY" --arg workflow "$QUALIFIED_MASTER" \
            --arg source "$QUALIFIED_SOURCE" --arg ref "$CANDIDATE_REF" \
            --arg version "$SNAPSHOT" --arg manifest "$MANIFEST" --arg run "$QUALIFIED_RUN" '
            .repository == $repository and .workflow == $workflow and .source == $source and .ref == $ref
            and .workflowDigest == "sha256:66adba70b780f1379fa6d73fa1ff9df58476e81dd62d27336bb471c3235c80d7"
            and .run == $run and .attempt == "1" and .pins == []
            and .productionIdentity == "sha256:fe88a37029bb9b7d561fab0a23061f95daa2c51da6459ac91baad7857ff242e3"
            and .version == {version:$version, tag:("v"+$version), target:$source, channel:"pilot"}
            and .qualification.id == "14715569002"
            and .qualification.zipDigest == "sha256:e6a62bdac5b12c92d26ba5eeabe4df9ed76c85354e97f6245ee25abb12bf8f20"
            and .oci.id == "14715761748"
            and .oci.zipDigest == "sha256:912ab7f8fb9a2bb94cd986705027eaf954905fd7a47f8e61a71c71ac57cc1f3d"
            and .oci.manifest == $manifest and .oci.platform == "linux/amd64"' context.json > /dev/null
          jq -jr '.qualification.files' context.json > context-qualification.expected
          jq -jr '.oci.files' context.json > context-oci.expected
          cmp context-qualification.expected qualification.actual
          cmp context-oci.expected oci.actual
          tar -xOf image.oci.tar index.json | jq -e --arg manifest "$MANIFEST" '
            .schemaVersion == 2 and (.manifests | length) == 1 and .manifests[0].digest == $manifest
            and .manifests[0].mediaType == "application/vnd.oci.image.manifest.v1+json"' > /dev/null
          tar -xOf image.oci.tar "blobs/sha256/${MANIFEST#sha256:}" | sha256sum | grep -Fx "${MANIFEST#sha256:}  -"
          mv image.oci.tar "$RUNNER_TEMP/team-registry.oci.tar"

      - name: Publish or reconcile the immutable version
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          umask 077
          evidence="$RUNNER_TEMP/snapshot-receipt.json"
          state="$(mktemp -d "$RUNNER_TEMP/ghcr.XXXXXX")"
          trap 'rm -rf "$state"' EXIT
          destination="docker://ghcr.io/$PACKAGE"
          media="application/vnd.oci.image.manifest.v1+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.docker.distribution.manifest.list.v2+json"
          skopeo() {
            docker run --rm -i --platform linux/amd64 --entrypoint /usr/bin/skopeo \
              --mount "type=bind,source=$state,target=/state" \
              --mount "type=bind,source=$RUNNER_TEMP/team-registry.oci.tar,target=/qualified.oci.tar,readonly" \
              "$SKOPEO" "$@"
          }
          lookup() {
            printf 'header = "Authorization: Bearer %s"\n' "$1" | curl --config - -sS --max-time 30 \
              -H "Accept: $media" -o "$state/manifest" -w '%{http_code}' "https://ghcr.io/v2/$PACKAGE/manifests/$2"
          }
          check_digest() {
            printf '%s  %s\n' "${MANIFEST#sha256:}" "$state/manifest" | sha256sum --check
          }
          record() {
            jq -n --arg outcome "$1" --arg operation "$operation" --arg image "ghcr.io/$PACKAGE:$SNAPSHOT" \
              --arg manifest "$MANIFEST" --arg tarDigest "sha256:$OCI_TAR" \
              --arg contextDigest "sha256:$CONTEXT_ZIP" --arg workflow "$GITHUB_SHA" \
              --arg source "$QUALIFIED_SOURCE" --arg qualificationRun "$QUALIFIED_RUN" \
              --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
              '{outcome:$outcome, operation:$operation, image:$image, manifest:$manifest, ociTarDigest:$tarDigest,
                workflow:$workflow, source:$source, qualificationRun:$qualificationRun, qualificationAttempt:1,
                qualificationArtifact:14715569002, ociArtifact:14715761748, contextArtifact:14716061731,
                contextZipDigest:$contextDigest, publicationRun:$run, publicationAttempt:$attempt}' > "$evidence"
          }

          docker pull --platform linux/amd64 "$SKOPEO"
          skopeo inspect --raw oci-archive:/qualified.oci.tar | sha256sum | grep -Fx "${MANIFEST#sha256:}  -"

          upstream="https://github.com/$GITHUB_REPOSITORY.git"
          [[ "$(git ls-remote --exit-code "$upstream" refs/heads/master)" == "$GITHUB_SHA"$'\trefs/heads/master' ]]
          [[ "$(git ls-remote --exit-code "$upstream" "$CANDIDATE_REF")" == "$QUALIFIED_SOURCE"$'\t'"$CANDIDATE_REF" ]]
          registry_token="$(printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GHCR_TOKEN" | \
            curl --config - -fsS --max-time 30 --get https://ghcr.io/token \
              --data-urlencode service=ghcr.io --data-urlencode "scope=repository:$PACKAGE:pull,push" | jq -er '.token')"
          [[ "$registry_token" =~ ^[A-Za-z0-9_.=+/-]+$ ]]
          printf '::add-mask::%s\n' "$registry_token"
          status="$(lookup "$registry_token" "$SNAPSHOT")"
          operation=none
          case "$status" in
            200)
              if ! check_digest; then
                record tag_conflict
                exit 1
              fi
              operation=reconciled
              ;;
            404)
              jq -e '(.errors | length) == 1 and .errors[0].code == "MANIFEST_UNKNOWN"' "$state/manifest" > /dev/null
              operation=copy
              record copy_pending_verification
              printf '%s\n' "$GHCR_TOKEN" | skopeo login --authfile /state/auth.json --username "$GITHUB_ACTOR" --password-stdin ghcr.io
              status="$(lookup "$registry_token" "$SNAPSHOT")"
              if [[ "$status" == 200 ]]; then
                if ! check_digest; then
                  record tag_conflict
                  exit 1
                fi
                operation=reconciled
              else
                [[ "$status" == 404 ]]
                jq -e '(.errors | length) == 1 and .errors[0].code == "MANIFEST_UNKNOWN"' "$state/manifest" > /dev/null
                skopeo copy --preserve-digests --digestfile /state/published-digest \
                  --dest-authfile /state/auth.json oci-archive:/qualified.oci.tar "$destination:$SNAPSHOT"
                [[ "$(cat "$state/published-digest")" == "$MANIFEST" ]]
                operation=published
              fi
              ;;
            *)
              record registry_lookup_refused
              exit 1
              ;;
          esac

          [[ "$(lookup "$registry_token" "$SNAPSHOT")" == 200 ]]
          check_digest
          [[ "$(lookup "$registry_token" "$MANIFEST")" == 200 ]]
          check_digest
          record registry_verified
          printf '{}\n' > "$state/anonymous.json"
          if skopeo copy --preserve-digests --src-authfile /state/anonymous.json \
              "$destination@$MANIFEST" dir:/state/anonymous-pull; then
            printf '%s  %s\n' "${MANIFEST#sha256:}" "$state/anonymous-pull/manifest.json" | sha256sum --check
            skopeo inspect --raw --authfile /state/anonymous.json "$destination:$SNAPSHOT" > "$state/manifest"
            check_digest
            record anonymous_pull_verified
          else
            record anonymous_pull_unverified
            printf '::warning::Authenticated digest verified. Anonymous access remains unverified.\n'
            exit 1
          fi

      - name: Upload publication receipt
        if: always() && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: team-registry-snapshot-${{ github.run_attempt }}
          path: ${{ runner.temp }}/snapshot-receipt.json
          if-no-files-found: ignore
